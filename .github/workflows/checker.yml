name: Auto Key Checker

on:
  schedule:
    - cron: '0 */4 * * *'          # каждые 4 часа (в 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch:               # ручной запуск

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Xray
        run: |
          curl -L "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -o xray.zip
          unzip -o xray.zip
          chmod +x xray

      - name: Download sing-box (optional, для hy2/tuic)
        continue-on-error: true
        run: |
          SB_VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -oP '"tag_name": *"v\K[^"]+')
          echo "sing-box version: $SB_VER"
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz" -o sb.tar.gz
          tar -xzf sb.tar.gz
          cp sing-box-*/sing-box ./sing-box
          chmod +x ./sing-box
          ./sing-box version || true

      - name: Run Checker
        run: python main.py
        timeout-minutes: 220
        env:
          PYTHONUNBUFFERED: 1

      - name: White/Black stats
        if: always()
        run: |
          for f in checked/RU_Best/ru_white_all_WHITE.txt checked/RU_Best/ru_white_all_BLACK.txt \
                   checked/My_Euro/my_euro_all_WHITE.txt checked/My_Euro/my_euro_all_BLACK.txt; do
            if [ -f "$f" ]; then echo "$f: $(grep -c . "$f" || true) строк"; fi
          done
          echo "unverified (RU ALL): $(grep -h -c '\[unverified\]' checked/RU_Best/ru_white_all_part*.txt 2>/dev/null | paste -sd+ | bc 2>/dev/null || echo n/a)"
          echo "unsupported_proto: $(grep -h -c '\[unsupported_proto\]' checked/RU_Best/ru_white_all_part*.txt 2>/dev/null | paste -sd+ | bc 2>/dev/null || echo n/a)"

      - name: Remove null bytes from checked files
        run: |
          find checked/ -name "*.txt" -exec sed -i 's/\x00//g' {} \;
          find checked/ -name "*.json" -exec sed -i 's/\x00//g' {} \; || true

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Добавляем все изменённые файлы (игнорируем ошибки, если файлов нет)
          git add checked/subscriptions_list.txt || true
          git add checked/**/*.txt || true
          git add checked/**/*.json || true

          # Проверяем, есть ли изменения для коммита
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Создаём коммит
          git commit -m "🤖 Auto-update checked keys [${{ github.run_id }}]"

          # Синхронизируемся с удалённой веткой: забираем последние изменения
          # и перебазируем наш коммит поверх них.
          # --autostash сохраняет незакоммиченные изменения, если они есть,
          # а -X ours автоматически разрешает конфликты в пользу наших файлов.
          git pull --rebase --autostash -X ours origin main || {
            echo "Rebase failed, aborting and using force push as fallback"
            git rebase --abort
            git push --force origin main
            exit 0
          }

          # Безопасный push (проверяет, что удалённая ветка не изменилась с момента последнего pull)
          git push --force-with-lease origin main
