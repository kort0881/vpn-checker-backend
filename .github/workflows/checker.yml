name: Auto Key Checker

on:
  schedule:
    - cron: '0 */4 * * *'          # каждые 4 часа (в 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch:               # ручной запуск

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Xray
        run: |
          curl -L "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -o xray.zip
          unzip -o xray.zip
          chmod +x xray

      - name: Run Checker
        run: python main.py
        timeout-minutes: 340
        env:
          PYTHONUNBUFFERED: 1

      - name: Remove null bytes from checked files
        run: |
          find checked/ -name "*.txt" -exec sed -i 's/\x00//g' {} \;
          find checked/ -name "*.json" -exec sed -i 's/\x00//g' {} \; || true

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Добавляем все изменённые файлы (игнорируем ошибки, если файлов нет)
          git add checked/subscriptions_list.txt || true
          git add checked/**/*.txt || true
          git add checked/**/*.json || true

          # Проверяем, есть ли изменения для коммита
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Создаём коммит
          git commit -m "🤖 Auto-update checked keys [${{ github.run_id }}]"

          # Синхронизируемся с удалённой веткой: забираем последние изменения
          # и перебазируем наш коммит поверх них.
          # При конфликте в файлах checked/ оставляем наши версии (-X ours)
          git pull --rebase -X ours origin main || {
            echo "Rebase failed, aborting and using force push as fallback"
            git rebase --abort
            git push --force origin main
            exit 0
          }

          # Безопасный push (проверяет, что удалённая ветка не изменилась с момента последнего pull)
          git push --force-with-lease origin main
